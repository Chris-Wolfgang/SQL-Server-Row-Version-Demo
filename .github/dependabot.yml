version: 2
updates:
  # Keep the SHA-pinned third-party GitHub Actions in .github/workflows up to date.
  # This repo has no package manifests (only T-SQL scripts and Markdown), so
  # github-actions is the only ecosystem Dependabot can track here.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns:
          - "*"
